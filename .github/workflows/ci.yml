name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: make test
      - name: Install from the repo root, as the README says
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          cd "$(mktemp -d)"
          npx --yes skills@1.5.9 add "$GITHUB_WORKSPACE" --agent codex --copy --yes
          cmp "$GITHUB_WORKSPACE/skills/cave-pony/SKILL.md" .agents/skills/cave-pony/SKILL.md
