name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: make test
      - name: Verify clean Codex installation
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          temp_dir="$(mktemp -d)"
          cd "$temp_dir"
          npx --yes skills@1.5.9 add \
            "$GITHUB_WORKSPACE/skills/cave-pony" \
            --agent codex \
            --copy \
            --yes
          test -f .agents/skills/cave-pony/SKILL.md
          grep -q '^name: cave-pony$' .agents/skills/cave-pony/SKILL.md
          grep -q '^version: 0.1.0$' .agents/skills/cave-pony/SKILL.md
      - name: Verify documented host install paths
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          temp_dir="$(mktemp -d)"
          cd "$temp_dir"
          npx --yes skills@1.5.9 add \
            "https://github.com/wilfgrainger/cave-pony/tree/main/skills/cave-pony" \
            --agent claude-code \
            --agent codex \
            --agent hermes-agent \
            --agent openclaw \
            --copy \
            --yes
          test -f .claude/skills/cave-pony/SKILL.md
          test -f .agents/skills/cave-pony/SKILL.md
          test -f .hermes/skills/cave-pony/SKILL.md
          test -f skills/cave-pony/SKILL.md
          for file in \
            .claude/skills/cave-pony/SKILL.md \
            .agents/skills/cave-pony/SKILL.md \
            .hermes/skills/cave-pony/SKILL.md \
            skills/cave-pony/SKILL.md
          do
            grep -q '^name: cave-pony$' "$file"
            grep -q '^version: 0.1.0$' "$file"
          done
